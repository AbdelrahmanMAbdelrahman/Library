<nav>
    <div class="dashboard">

        <a [routerLink]="['/Dashboard']" class="nav-link d-flex ">
            <i class="bi bi-ui-radios-grid"></i>
            <p class="">Dashboard</p>
        </a>
    </div>
    <div class="nav-bar">
        <ul>
        
            <li class="">
                <a [routerLink]="['BookPage','BookListPage']">
                    
                    <i class="bi bi-book"></i>
                    <p class="text-light">Books</p>
                </a>
                </li>
            <li>
                <a [routerLink]="['/BorrowingRecordPage','BorrowingRecordListPage']">

                    <i class="bi bi-journal-plus"></i>
                    <p class="">Borrowing Record</p>    
                </a>
            </li>
            <li>
                <a [routerLink]="['/FinePage','FineListPage']">
                    <i class="bi bi-coin"></i>
                    <p class="">  Fines</p>
                </a>
            </li>
            <li>
                <a [routerLink]="['/ReservationPage','ReservationListPage']">
                    <i class="bi bi-calendar-event"></i>
                    <p class="">  Reservation</p>
                </a>
            </li>
        </ul>
            
    </div>
    <div class="notification">

    <button
        type="button"
        class="notification-button"
        (click)="toggleNotifications()">

        <i class="bi bi-bell"></i>

        <span
            *ngIf="notifications.length > 0"
            class="notification-badge">
            {{ notifications.length }}
        </span>

    </button>


    <!-- Notification popup -->
    <div
        class="notification-popup"
        *ngIf="showNotifications">

        <div class="notification-header">
            <span>Notifications</span>

            <button
                type="button"
                class="close-popup"
                (click)="closeNotifications()">
                ×
            </button>
        </div>


        <div
            class="notification-item"
            *ngFor="let notification of notifications">

            <div class="notification-icon">
                <i class="bi bi-book"></i>
            </div>

            <div class="notification-content">

                <p>
                    {{ notification.message }}
                </p>

                <div class="notification-actions">

                    <button
                        type="button"
                        class="btn-open"
                        [routerLink]="">
                        Open
                    </button>

                    <button
                        type="button"
                        class="btn-close"
                        (click)="closeNotification(notification)">
                        Close
                    </button>

                </div>

            </div>

        </div>


        <div
            class="empty-notification"
            *ngIf="notifications.length === 0">

            No notifications

        </div>

    </div>

</div>
</nav>
