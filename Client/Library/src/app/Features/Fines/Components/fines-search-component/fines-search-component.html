<div class="card">
    <form action="">

        <div class="card-body">
            <div class="form-group">
                <label for="userName" class="form-label">User Name</label>
                <input type="text" id="userName" class="form-control">
            </div>
            <div class="form-group">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" class="form-control">
            </div>
            <div class="form-group">
                <label for="fromBorrowingDate" class="form-label">From Borrowing Date</label>
                <input type="date" id="fromBorrowingDate" class="form-control">
            </div>
              <div class="form-group">
                <label for="toBorrowingDate" class="form-label">To Borrowing Date</label>
                <input type="date" id="toBorrowingDate" class="form-control">
            </div>
            
            <div class="form-group">
                <label for="fromDueDate" class="form-label">From Due Date</label>
                <input type="text" id="fromDueDate" class="form-control">
            </div>
            <div class="form-group">
                <label for="toDueDate" class="form-label">To Due Date</label>
                <input type="text" id="toDueDate" class="form-control">
            </div>
            <div class="form-group">
                <label for="lateDays" class="form-label">Late Days</label>
                <input type="text" id="lateDays" class="form-control">
            </div>
            <div class="form-group">
                <label for="fineAmount" class="form-label">FineAmount</label>
                <input type="text" id="fineAmount" class="form-control">
            </div>
            <div class="form-group">
                <label for="paymentStatus" class="form-label">Payment Status</label>
                <select class="form-select" name="paymentStatus" id="paymentStatus">
                    <option value="1">Paid</option>
                    <option value="2"> Un Paid</option>
                </select>
            </div>
          
        </div>
        <div class="card-footer">
            <button class="btn btn-secondary">Clear</button>
            <button class="btn btn-primary">Search</button>
        </div>
    </form>
</div>
