<div class="card" [formGroup]="FineForm!" (submit)="Search()">
    <form action="">

        <div class="card-body">
            <div class="form-group">
                <label for="userName" class="form-label">User Name</label>
                <input type="text" formControlName="userName" id="userName" class="form-control">
            </div>
            <div class="form-group">
                <label for="title" class="form-label">Title</label>
                <input type="text" formControlName="title" id="title" class="form-control">
            </div>
            <div class="form-group">
                <label for="fromBorrowingDate" class="form-label">From Borrowing Date</label>
                <input type="date" formControlName="fromBorrowingDate" id="fromBorrowingDate" class="form-control">
            </div>
              <div class="form-group">
                <label for="toBorrowingDate" class="form-label">To Borrowing Date</label>
                <input type="date" formControlName="toBorrowingDate" id="toBorrowingDate" class="form-control">
            </div>
            
            <div class="form-group">
                <label for="fromDueDate" class="form-label">From Due Date</label>
                <input type="date" formControlName="fromDueDate" id="fromDueDate" class="form-control">
            </div>
            <div class="form-group">
                <label for="toDueDate" class="form-label">To Due Date</label>
                <input type="date" formControlName="toDueDate" id="toDueDate" class="form-control">
            </div>
            <div class="form-group">
                <label for="lateDays" class="form-label">Late Days</label>
                <input type="number" formControlName="lateDays" id="lateDays" class="form-control">
            </div>
            <div class="form-group">
                <label for="fineAmount" class="form-label">FineAmount</label>
                <input type="number" formControlName="fineAmount" id="fineAmount" class="form-control">
            </div>
            <div class="form-group">
                <label for="paymentStatus" class="form-label">Payment Status</label>
                <select class="form-select" formControlName="paymentStatus" name="paymentStatus" id="paymentStatus">
                    <option value="0"> Un Paid</option>
                    <option value="1">Paid</option>
                </select>
            </div>
          
        </div>
        <div class="card-footer">
            <button type="button" (click)="Clear()" class="btn btn-secondary">Clear</button>
            <button  class="btn btn-primary">Search</button>
        </div>
    </form>
</div>
