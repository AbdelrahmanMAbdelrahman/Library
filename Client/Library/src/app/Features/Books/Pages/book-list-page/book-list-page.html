


<div class="book-page">
    <div class="book-search">
        <app-book-search 
        (OnSearch)="search($event)"></app-book-search>
    </div>
    <div class="book-grid">
       <app-book-list-component
         [paginatedCopies]="(paginatedCopies|async)!"
         (OnPaginate)="paginate($event)"
         >
         
       </app-book-list-component>
    </div>
</div>
