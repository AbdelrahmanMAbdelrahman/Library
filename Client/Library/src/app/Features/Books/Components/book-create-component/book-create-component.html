<div class="book-form">
    <form action="" [formGroup]="bookForm!" (submit)="SaveBook()">
        <div class="card">
            <div class="card-header">
             
            </div>
            <div class="card-body">
              <div class="form-group">
                <label for="genere" class="form-label">Genere</label>
                <input  id="genere" formControlName="genere"  type="text" class="form-control">
              </div>
              <div class="form-group">
                <label for="title" class="form-label">Title</label>
                <input id="title" type="text" formControlName="title" class="form-control">
              </div>
              <div class="form-group">
                <label for="isbn" class="form-label">ISBN</label>
                <input id="isbn" type="text" formControlName="isbn" class="form-control">
              </div>
              <div class="form-group">
                <label for="publiationDate" class="form-label">publication date</label>
                <input type="date" id="publiationDate" formControlName="publicationDate" class="form-control">
              </div>
              <div class="form-group">
                <label for="numberOfCopies" class="form-label">Number of Copies</label>
                <input [disabled]="!copy" type="number" id="numberOfCopies" formControlName="numberOfCopies" class="form-control">
              </div>
              <div class="form-group">
                <label for="additionalDetails" class="form-label">Additional Details</label>
                 <textarea name="additionalDetails" formControlName="additionalDetails" class="form-control" id="additionalDetails"></textarea>
            </div>
               <div class="d-flex">
                        <input #selectedImage class="form-control" 
                        (change)="selectImage($event)" accept="image/*"
                        type="file">
                        <button (click)="clearImage(selectedImage)" class="btn btn-secondary">Clear</button>
                        
                </div>
              
            </div>
            <div class="card-footer">
                <div class="footer-btns">
                  <button [routerLink]="['/BookPage','BookListPage']" type="button" class="btn btn-secondary">Cancel</button>
                  <button (click)="ClearForm()" type="button" class="btn btn-warning">Clear</button>
                  <button [disabled]="!bookForm?.valid" type="submit" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
    </form>
</div>
