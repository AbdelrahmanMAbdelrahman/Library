<div class="sign-in-container">

    <div class="card">
        <div class="card-header">
        <h3 class="text-light">Login</h3>
    </div>
    <form action="" [formGroup]="loginForm!" (submit)="SignIn()">
        <div class="card-body">
     <div class="form-group">
         <label for="" class="form-label">Email</label>
         <input placeholder="example@gmail.com" formControlName="email" type="email" class="form-control">
        </div>
        <div class="form-group">
            <label for="" class="form-label">Password</label>
            <input placeholder="*****" formControlName="password" type="password" class="form-control">
        </div>
    </div>
    <div class="card-footer">
        <div class="footer-elements">
         <div class="btn-login">
             <button class="btn btn-primary">Login</button>
         </div>
         <div class="sign-up-options">
             <span class="text-secondary">don't have an account? </span>
             <button type="button" class="btn btn-secondary" [routerLink]="['/AuthPage','SignUp']">Sign up</button>
            </div>
        </div>
    </div>
</form>
</div>
</div>
