<div class="borrowing-record-page">
<div class="borrowing-record-search">
    <app-borrowing-record-search-component
    (OnSearch)="Search($event)"
    ></app-borrowing-record-search-component>
</div>
<div class="borrowing-record-list">
    <app-borrowing-record-list-component
    [PaginatedBorrowingRecords]="(paginatedRecords|async)!"
    (OnPaginate)="Paginate($event)"
    ></app-borrowing-record-list-component>
</div>
</div>
